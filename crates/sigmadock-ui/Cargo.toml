[package]
name = "sigmadock-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["build.rs", "src/**", "README.md", "LICENSE", "Catppuccin-LICENSE.txt", "Lucide-LICENSE.txt", "assets/**"]
description = "Native GPUI workspace for supervising local coding agents"

[[bin]]
name = "sigma-dock"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
sigmadock-pty = { version = "0.1.2", path = "../sigmadock-pty" }
sigmadock-core = { version = "0.1.2", path = "../sigmadock-core" }
gpui.workspace = true
sigmadock-terminal = { version = "0.1.2", path = "../sigmadock-terminal" }
serde.workspace = true
reqwest.workspace = true
semver = "1"
libc = "0.2"

# gpui_http_client -> zed-async-tar -> xattr 0.2 still uses Linux ENOATTR,
# removed in libc 0.2.190. Remove this compatibility pin after upstream updates xattr.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData", "NSURL"] }

[build-dependencies]
serde_json.workspace = true
