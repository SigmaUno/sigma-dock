[package]
name = "sigma-dock-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
description = "Native GPUI workspace for supervising local coding agents"

[[bin]]
name = "sigma-dock"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
sigma-dock-core = { version = "0.1.0", path = "../sigma-dock-core" }
gpui.workspace = true
gpui-terminal.workspace = true

# gpui_http_client -> zed-async-tar -> xattr 0.2 still uses Linux ENOATTR,
# removed in libc 0.2.190. Remove this compatibility pin after upstream updates xattr.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
