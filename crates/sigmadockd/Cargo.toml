[package]
name = "sigmadockd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
description = "Local supervisor daemon for SigmaDock coding agents"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
uuid.workspace = true
sigmadock-core = { version = "0.1.2", path = "../sigmadock-core" }
sigmadock-store = { version = "0.1.2", path = "../sigmadock-store" }
sigmadock-git = { version = "0.1.2", path = "../sigmadock-git" }
sigmadock-agents = { version = "0.1.2", path = "../sigmadock-agents" }
sigmadock-ports = { version = "0.1.2", path = "../sigmadock-ports" }
sigmadock-pty = { version = "0.1.2", path = "../sigmadock-pty" }
sigmadock-forge = { version = "0.1.2", path = "../sigmadock-forge" }
fs2 = "0.4"
signal-hook = "0.3"
