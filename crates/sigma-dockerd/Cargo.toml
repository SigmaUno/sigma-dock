[package]
name = "sigma-dockerd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
description = "Local supervisor daemon for SigmaDock coding agents"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
uuid.workspace = true
sigma-dock-core = { version = "0.1.0", path = "../sigma-dock-core" }
sigma-dock-store = { version = "0.1.0", path = "../sigma-dock-store" }
sigma-dock-git = { version = "0.1.0", path = "../sigma-dock-git" }
sigma-dock-agents = { version = "0.1.0", path = "../sigma-dock-agents" }
sigma-dock-ports = { version = "0.1.0", path = "../sigma-dock-ports" }
sigma-dock-pty = { version = "0.1.0", path = "../sigma-dock-pty" }
sigma-dock-forge = { version = "0.1.0", path = "../sigma-dock-forge" }
fs2 = "0.4"
signal-hook = "0.3"
