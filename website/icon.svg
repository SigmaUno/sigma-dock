<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SigmaDock</title>
  <!-- Sigma drawn as a shell prompt: top bar + '>' chevron, with the bottom bar
       detached as a '_' cursor. Catppuccin Mocha colours. Body follows the macOS
       app-icon grid: 824px rounded square centred on a 1024px canvas.
       Used for 64px and larger; sigmadock-small.svg is used at 32px and below. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313244"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4befe"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <path d="M 712 318 L 336 318 L 540 512 L 336 706"
        fill="none" stroke="url(#glyph)" stroke-width="104"
        stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="470" y="654" width="242" height="104" rx="52" fill="#a6e3a1"/>
</svg>
