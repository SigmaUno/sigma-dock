name: Release crates
on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to publish (must already be committed)
        required: true
        default: '0.1.2'
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: crates-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve and validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          python3 scripts/release.py check "$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$version")" = "$GITHUB_SHA"
          fi
      - name: Preserve release tag before its branch advances
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ensure_build_ref.py --tag "v$RELEASE_VERSION"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked
      - run: python3 scripts/smoke.py
      - run: python3 scripts/feedback_smoke.py
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo publish --workspace --dry-run --locked
      - name: Publish missing crate versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.crates_token }}
        run: python3 scripts/release.py publish "$RELEASE_VERSION"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --verify-tag --title "SigmaDock $RELEASE_VERSION" --prerelease --generate-notes
          fi
