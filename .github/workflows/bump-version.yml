name: Prepare crate update
on:
  workflow_dispatch:
    inputs:
      version:
        description: New workspace version (for example 0.1.1)
        required: true
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update manifests and push release branch
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release.py bump "$NEW_VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "release/$NEW_VERSION"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -m "Prepare SigmaDock $NEW_VERSION"
          git push origin "release/$NEW_VERSION"
          echo "Updated all crates to $NEW_VERSION. Review and merge this branch before publishing." >> "$GITHUB_STEP_SUMMARY"
          echo "[Review version update](https://github.com/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...release/$NEW_VERSION)" >> "$GITHUB_STEP_SUMMARY"
