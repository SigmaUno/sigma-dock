[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/sigma-dock-cli", "crates/sigma-dockerd", "crates/sigma-dock-mcp"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/SigmaUno/sigma-dock"
homepage = "https://sigmauno.com"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "=0.9.0"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

# Rust 1.96 can strip proc-macro dylibs into a LINKEDIT layout rejected by
# macOS 27. Keep compile-time debug info; final application profiles stay unchanged.
# https://github.com/rust-lang/rust/issues/157750
[profile.dev.build-override]
debug = 2
strip = "none"

[profile.release.build-override]
debug = 2
strip = "none"
