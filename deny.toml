[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { name = "sentry" },
    { name = "sentry-core" },
    { name = "sentry-tracing" },
    { name = "posthog-rs" },
    { name = "posthog" },
    { name = "segment" },
    { name = "analytics" },
    { name = "mixpanel" },
    { name = "amplitude" },
    { name = "opentelemetry-otlp" },
    { name = "opentelemetry-jaeger" },
    { name = "opentelemetry-zipkin" },
]

[licenses]
confidence-threshold = 0.8
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "NCSA", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSL-1.0", "CC0-1.0", "Unlicense", "OpenSSL", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Pinned native UI dependencies have maintenance notices, not vulnerability exceptions.
# Review these when updating GPUI. Vulnerabilities and unsoundness remain enforced.
[advisories]
unsound = "all"
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "GPUI 0.2.2 requires async-std transitively; track native stack upgrade in docs/DEPENDENCIES.md" },
    { id = "RUSTSEC-2024-0384", reason = "GPUI native dependency uses instant; maintenance-only notice, tracked in docs/DEPENDENCIES.md" },
    { id = "RUSTSEC-2024-0436", reason = "GPUI and terminal dependencies use paste; maintenance-only notice, tracked in docs/DEPENDENCIES.md" },
    { id = "RUSTSEC-2026-0173", reason = "GPUI macro dependency uses proc-macro-error2; maintenance-only notice, tracked in docs/DEPENDENCIES.md" },
    { id = "RUSTSEC-2025-0134", reason = "GPUI HTTP helper uses rustls-pemfile; SigmaDock UI does not instantiate its HTTP client, track upgrade" },
    { id = "RUSTSEC-2026-0206", reason = "Pinned GPUI font stack requires rustybuzz; maintenance-only notice, tracked in docs/DEPENDENCIES.md" },
    { id = "RUSTSEC-2026-0192", reason = "Pinned GPUI font stack requires ttf-parser; maintenance-only notice, tracked in docs/DEPENDENCIES.md" },
]
